<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | FinanceHub PRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 400: '#34d399', 500: '#22c55e', 600: '#16a34a' }, surface: '#020617' }, fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        html, body { background-color: #020617; color: white; overflow: hidden; height: 100%; }
        body { display: flex; align-items: center; justify-content: center; position: relative; }

        .bg-scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .blob { position: absolute; border-radius: 9999px; filter: blur(100px); opacity: 0.25; animation: float-blob 22s ease-in-out infinite; }
        .blob-1 { width: 460px; height: 460px; background: radial-gradient(circle, #22c55e, transparent 70%); top: -160px; left: -140px; }
        .blob-2 { width: 400px; height: 400px; background: radial-gradient(circle, #16a34a, transparent 70%); bottom: -150px; right: -120px; animation-delay: -9s; }
        @keyframes float-blob { 0%, 100% { transform: translate(0,0) scale(1); } 33% { transform: translate(30px,-40px) scale(1.07); } 66% { transform: translate(-25px,25px) scale(0.94); } }

        /* ===== gráfico de crescimento desenhado ao fundo: reforça o tema "dinheiro/finanças" ===== */
        .chart-decor { position: absolute; z-index: 0; width: min(720px, 92vw); left: 50%; top: 50%; transform: translate(-50%, -50%); opacity: 0.5; pointer-events: none; }
        .chart-line { fill: none; stroke: url(#gradLinha); stroke-width: 0.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw-line 2.2s cubic-bezier(.65,0,.35,1) .3s forwards; }
        .chart-area { opacity: 0; animation: fade-area 1.5s ease .9s forwards; }
        @keyframes draw-line { to { stroke-dashoffset: 0; } }
        @keyframes fade-area { to { opacity: 1; } }
        .chart-dot { opacity: 0; transform-origin: center; animation: dot-pop .45s cubic-bezier(.34,1.56,.64,1) forwards; }
        @keyframes dot-pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
        .chart-dot-live { animation: dot-pop .45s cubic-bezier(.34,1.56,.64,1) forwards, pulse-ring 2s ease-out 2.4s infinite; }
        @keyframes pulse-ring { 0% { filter: drop-shadow(0 0 0 rgba(52,211,153,0.6)); } 70%, 100% { filter: drop-shadow(0 0 6px rgba(52,211,153,0)); } }

        /* ===== "dinheiro" flutuando sutilmente ao fundo ===== */
        .coin { position: absolute; bottom: -10%; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: rgba(52,211,153,0.55); border: 1px solid rgba(52,211,153,0.25); background: rgba(34,197,94,0.06); animation: rise linear infinite; }
        @keyframes rise { from { transform: translateY(0) rotate(0deg); opacity: 0; } 10%, 85% { opacity: 1; } to { transform: translateY(-112vh) rotate(18deg); opacity: 0; } }

        .login-card { animation: fade-in-up .6s cubic-bezier(.22,1,.36,1) both; transition: box-shadow .4s, border-color .4s; position: relative; z-index: 1; }
        .login-card:hover { border-color: rgba(34, 197, 94, 0.22); box-shadow: 0 25px 60px -15px rgba(34,197,94,0.15), 0 25px 50px -12px rgba(0,0,0,0.5); }
        @keyframes fade-in-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .icon-badge { animation: icon-pop .6s cubic-bezier(.34,1.56,.64,1) both; }
        @keyframes icon-pop { from { opacity: 0; transform: scale(0.5) rotate(-10deg); } to { opacity: 1; transform: scale(1) rotate(0); } }

        .field-group { opacity: 0; transform: translateY(12px); animation: field-in .5s cubic-bezier(.22,1,.36,1) forwards; }
        @keyframes field-in { to { opacity: 1; transform: translateY(0); } }

        .input-wrap { position: relative; }
        .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; transition: color .25s ease; pointer-events: none; }
        .input-field { transition: all 0.25s ease; background: rgba(2,6,23,0.55); }
        .input-field:focus { box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15); border-color: #22c55e; }
        .input-wrap:focus-within .input-icon { color: #34d399; }

        .btn-login-glow { position: relative; overflow: hidden; }
        .btn-login-glow::after { content: ''; position: absolute; top: 0; left: -75%; width: 50%; height: 100%; background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent); transform: skewX(-20deg); }
        .btn-login-glow:hover::after { animation: shine-sweep 1s ease forwards; }
        @keyframes shine-sweep { from { left: -75%; } to { left: 125%; } }

        .spinner { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        ::selection { background: rgba(34, 197, 94, 0.35); color: #fff; }
        @media (prefers-reduced-motion: reduce) {
            .blob, .login-card, .icon-badge, .coin { animation: none !important; }
            .chart-line, .chart-area, .chart-dot, .chart-dot-live { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; }
            .field-group { animation: none !important; opacity: 1 !important; transform: none !important; }
        }
    </style>
</head>
<body class="antialiased">

    <div class="bg-scene">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- gráfico de crescimento, decorativo, ao fundo do card -->
    <svg class="chart-decor" viewBox="0 0 400 200" aria-hidden="true">
        <defs>
            <linearGradient id="gradLinha" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#16a34a"/>
                <stop offset="100%" stop-color="#34d399"/>
            </linearGradient>
            <linearGradient id="gradArea" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/>
                <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
            </linearGradient>
        </defs>
        <path class="chart-area" d="M10,170 L70,150 L140,158 L210,100 L280,112 L340,55 L390,40 L390,200 L10,200 Z" fill="url(#gradArea)" pathLength="1"/>
        <path class="chart-line" d="M10,170 L70,150 L140,158 L210,100 L280,112 L340,55 L390,40" pathLength="1"/>
        <circle class="chart-dot" cx="70" cy="150" r="3.2" fill="#34d399" style="animation-delay:1.3s"/>
        <circle class="chart-dot" cx="140" cy="158" r="3.2" fill="#34d399" style="animation-delay:1.55s"/>
        <circle class="chart-dot" cx="210" cy="100" r="3.2" fill="#34d399" style="animation-delay:1.8s"/>
        <circle class="chart-dot" cx="280" cy="112" r="3.2" fill="#34d399" style="animation-delay:2.05s"/>
        <circle class="chart-dot chart-dot-live" cx="390" cy="40" r="4.2" fill="#34d399" style="animation-delay:2.3s, 2.4s"/>
    </svg>

    <!-- "dinheiro" flutuando sutilmente ao fundo -->
    <div id="coin-scene" class="bg-scene" aria-hidden="true"></div>

    <div class="login-card w-full max-w-md mx-6 p-8 border border-white/10 rounded-3xl bg-surface/60 backdrop-blur-xl shadow-2xl">
        <div class="icon-badge flex justify-center mb-6">
            <div class="w-16 h-16 rounded-2xl bg-brand-500/10 border border-brand-500/25 flex items-center justify-center">
                <i data-lucide="bar-chart-3" class="text-brand-500 h-8 w-8"></i>
            </div>
        </div>
        <h2 class="text-2xl font-bold text-center mb-1">Acessar minha conta</h2>
        <p class="text-slate-500 text-sm text-center mb-8">Entre com o e-mail e senha da sua compra</p>

        <form id="login-form" class="space-y-4">
            <div class="field-group" style="animation-delay:.1s">
                <label class="block text-sm text-slate-400 mb-1">E-mail</label>
                <div class="input-wrap">
                    <i data-lucide="mail" class="input-icon h-4 w-4"></i>
                    <input type="email" id="email" autocomplete="email" required class="input-field w-full pl-11 pr-4 py-3 rounded-xl border border-white/10 text-white focus:outline-none">
                </div>
            </div>
            <div class="field-group" style="animation-delay:.18s">
                <label class="block text-sm text-slate-400 mb-1">Senha</label>
                <div class="input-wrap">
                    <i data-lucide="lock" class="input-icon h-4 w-4"></i>
                    <input type="password" id="password" autocomplete="current-password" required class="input-field w-full pl-11 pr-12 py-3 rounded-xl border border-white/10 text-white focus:outline-none">
                    <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors" aria-label="Mostrar senha" tabindex="-1">
                        <i data-lucide="eye" class="h-5 w-5"></i>
                    </button>
                </div>
            </div>
            <button type="submit" id="btn-login" class="field-group btn-login-glow w-full bg-brand-500 text-black font-bold py-3 rounded-xl hover:scale-[1.02] transition-transform flex items-center justify-center gap-2" style="animation-delay:.26s">
                <span id="btn-login-texto">Entrar</span>
            </button>
        </form>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        // Mesma URL e Anon Key usadas em checkout.html e meus-produtos.html.
        const supabase = createClient(
            'https://tbcggvrbmoqrjngtyrbb.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRiY2dndnJibW9xcmpuZ3R5cmJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0ODEyODAsImV4cCI6MjEwMjA1NzI4MH0.y78Q8oAXAxj4afY53R9HO8tsip8KA3DZtj36TPcICCQ'
        );
        lucide.createIcons();

        // Símbolos de R$ subindo lentamente ao fundo, tipo bolhas — reforça o tema "dinheiro"
        // sem exagerar (poucos, discretos, atrás do card).
        const cena = document.getElementById('coin-scene');
        if (window.matchMedia('(prefers-reduced-motion: no-preference)').matches) {
            const tamanhos = [26, 34, 22, 30, 24];
            tamanhos.forEach((tam, i) => {
                const moeda = document.createElement('div');
                moeda.className = 'coin';
                moeda.textContent = 'R$';
                moeda.style.width = moeda.style.height = tam + 'px';
                moeda.style.fontSize = (tam * 0.36) + 'px';
                moeda.style.left = (8 + i * 21 + Math.random() * 8) + '%';
                moeda.style.animationDuration = (14 + i * 3) + 's';
                moeda.style.animationDelay = (-i * 4) + 's';
                cena.appendChild(moeda);
            });
        }

        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        togglePassword.addEventListener('click', () => {
            const mostrando = passwordInput.type === 'text';
            passwordInput.type = mostrando ? 'password' : 'text';
            togglePassword.innerHTML = `<i data-lucide="${mostrando ? 'eye' : 'eye-off'}" class="h-5 w-5"></i>`;
            togglePassword.setAttribute('aria-label', mostrando ? 'Mostrar senha' : 'Ocultar senha');
            lucide.createIcons();
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            const btnTexto = document.getElementById('btn-login-texto');

            btn.disabled = true;
            btnTexto.innerHTML = '<i data-lucide="loader-2" class="h-5 w-5 spinner"></i>';
            lucide.createIcons();

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert("E-mail ou senha incorretos.");
                btn.disabled = false;
                btnTexto.textContent = "Entrar";
            } else {
                window.location.href = "meus-produtos.html"; // Vai para a área logada
            }
        });
    </script>
</body>
</html>
